name: 自动更新 NOTAM 数据

on:
  schedule:
    # 每 30 分钟运行一次 (UTC 时间)
    - cron: '*/30 * * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'config.ini'
      - 'fetch/**'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 缓存 pip 依赖，加速 CI
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取并处理 NOTAM 数据
        env:
          FAA_API_KEY: ${{ secrets.FAA_API_KEY }}
        run: |
          python main.py

      - name: 提交更新后的数据和图片
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有数据文件或图片变更
          CHANGED=false
          if ! git diff --quiet data/; then
            CHANGED=true
          fi
          if ! git diff --quiet static/images/launches/; then
            CHANGED=true
          fi

          if [ "$CHANGED" = false ]; then
            echo "数据和图片无变化，跳过提交"
          else
            git add data/ static/images/launches/
            git commit -m "自动更新 NOTAM 数据和发射图片 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
