# ============================================================
# 航空通 - NOTAM 航空通告实时可视化系统 配置文件
# ============================================================

# 数据源选择：faa, daip, dins, msi。多个数据源用逗号分隔，按顺序聚合去重
[DATA_SOURCES]
enabled = faa

# FIR/ICAO 配置 - 需要获取航警的飞行情报区(FIR)代码或机场ICAO代码
# 中国八大情报区 + 周边亚太区域
[ICAO]
codes = ZBPE ZGZU ZHWH ZJSA ZLHW ZPKM ZSHA ZWUQ ZYSH VVTS WSJC WIIF YMMM WMFC RPHI RJJJ RCAA YBBB VOMF WAAF

# FAA NOTAM Search 配置
[FAA]
search_url = https://notams.aim.faa.gov/notamSearch/search
api_v1_url = https://external-api.faa.gov/notamapi/v1/notams
api_key =                    # FAA API 密钥(可选，在 https://api.faa.gov/ 注册获取)
index_url = https://notams.aim.faa.gov/notamSearch/nsapp.html
freeform_terms = AEROSPACE,ROCKET,DNG ZONE,DANGER AREA,RESTRICTED,TEMPORARY FLIGHT RESTRICTION
timeout = 10
retries = 1
max_workers = 3
max_pages = 100

# DAIP (Defense Aviation Integration Portal) 配置
[DAIP]
query_url = https://www.daip.jcs.mil/daip/mobile/query
index_url = https://www.daip.jcs.mil/daip/mobile/index
timeout = 20
verify_ssl = false
radius = 10
sort = Criticality

# 区域颜色配置 - 每种NOTAM类型对应一种颜色
[COLORS]
danger = #FF1744        # 红色 - 临时危险区(火箭发射/导弹试射)
restricted = #FF6D00     # 橙色 - 限制区(军事活动)
warning = #FFD600        # 黄色 - 警告区(潜在危险)
prohibited = #AA00FF     # 紫色 - 禁航区(完全禁飞)
tfr = #2962FF           # 蓝色 - 临时飞行限制(TFR)
airway = #00C853         # 绿色 - 航路变更
other = #546E7A          # 灰色 - 其他类型

# 坐标范围过滤 - 只显示东经范围内的区域
[FILTER]
lon_min = 60.0
lon_max = 180.0
lat_min = -30.0
lat_max = 70.0

# 本地服务器配置(可选，用于本地开发预览)
[SERVER]
host = 127.0.0.1
port = 5000
auto_open_browser = false

# 数据更新间隔(分钟) - GitHub Actions 调度参考
[UPDATE]
interval_minutes = 30

# 发射计划数据源 (Launch Library 2 API - 免费无需密钥)
[LAUNCHES]
base_url = https://ll.thespacedevs.com/2.2.0/launch/upcoming/
timeout = 15
retries = 2
limit = 50
# 发射状态筛选 (留空=全部, 1=Go, 2=TBD, 8=即将发射)
status_filter =

