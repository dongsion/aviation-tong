<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="航空通 - NOTAM 航空通告与火箭发射计划实时可视化系统">
    <title>航空通 - NOTAM 通告 + 火箭发射实时地图</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">

    <!-- Leaflet CSS (本地) -->
    <link rel="stylesheet" href="static/leaflet/leaflet.css?v=16">
    <!-- 自定义 CSS -->
    <link rel="stylesheet" href="static/css/style.css?v=16">
    <!-- 付费功能 CSS -->
    <link rel="stylesheet" href="static/css/premium.css?v=16">
</head>
<body>

    <!-- ============================================================
         主布局: 侧边栏 + 地图 (无顶栏，全部信息在左侧)
         ============================================================ -->
    <div class="main-container">

        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">

            <!-- 侧边栏头部: Logo + 折叠按钮 -->
            <div class="sidebar-header">
                <div class="logo">
                    <span class="icon">✈️</span>
                    <div class="logo-text">
                        <div class="logo-title">航空通</div>
                        <div class="logo-subtitle">NOTAM + 火箭发射 + 卫星追踪</div>
                    </div>
                </div>
                <button class="btn-collapse" onclick="toggleSidebar()" title="折叠侧边栏">
                    <span>◀</span>
                </button>
            </div>

            <!-- 状态信息 (可折叠) -->
            <div class="sidebar-section" id="section-status">
                <div class="section-title" onclick="toggleSection('section-status')">
                    <span>📊</span>
                    <span>状态信息</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" id="status-content">
                    <div class="status-grid">
                        <div class="status-cell">
                            <span class="status-dot"></span>
                            <span>实时连接</span>
                        </div>
                        <div class="status-cell">
                            NOTAM: <span id="stat-total" style="font-weight:700;color:var(--text-primary)">0</span>
                        </div>
                        <div class="status-cell">
                            生效: <span id="stat-active" style="font-weight:700;color:#00e676">0</span>
                        </div>
                        <div class="status-cell">
                            🚀发射: <span id="stat-launches" style="font-weight:700;color:#FFAB00">0</span>
                        </div>
                        <div class="status-cell">
                            🛰️卫星: <span id="stat-satellites" style="font-weight:700;color:#00E5FF">0</span>
                        </div>
                        <div class="status-cell">
                            来源: <span id="stat-source" style="font-weight:700">N/A</span>
                        </div>
                        <div class="status-cell">
                            更新: <span id="stat-update" style="font-weight:600">--</span>
                        </div>
                    </div>
                    <div class="status-buttons">
                        <button class="btn-action" id="btn-toggle-sat" onclick="toggleSatellites()">
                            🛰️ 卫星
                        </button>
                        <button class="btn-action" id="btn-refresh" onclick="manualRefresh()">
                            🔄 刷新数据
                        </button>
                    </div>
                </div>
            </div>

            <!-- 图例区 -->
            <div class="sidebar-section" id="section-legend">
                <div class="section-title" onclick="toggleSection('section-legend')">
                    <span>🎨</span>
                    <span>颜色说明</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" style="max-height:320px;overflow-y:auto;">
                    <div class="legend" id="legend">
                        <div style="color:var(--text-muted);font-size:12px;padding:8px 0;">
                            加载中...
                        </div>
                    </div>
                </div>
            </div>

            <!-- 发射计划列表 -->
            <div class="sidebar-section" id="section-launches" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:200px;">
                <div class="section-title" onclick="toggleSection('section-launches')">
                    <span>🚀</span>
                    <span>火箭发射计划</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" id="launch-list" style="flex:1;overflow-y:auto;">
                    <div class="notam-empty">加载中...</div>
                </div>
            </div>

            <!-- 卫星追踪 -->
            <div class="sidebar-section" id="section-satellites" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:200px;">
                <div class="section-title" onclick="toggleSection('section-satellites')">
                    <span>🛰️</span>
                    <span>卫星实时追踪</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
                    <!-- 搜索栏 -->
                    <div class="sat-search-bar">
                        <input type="text" id="satellite-search-input"
                               placeholder="🔍 搜索卫星名称/编号..."
                               oninput="searchSatellite()"
                               onkeydown="if(event.key==='Enter')searchSatellite()">
                    </div>
                    <!-- 卫星列表 -->
                    <div id="satellite-list" style="flex:1;overflow-y:auto;">
                        <div class="notam-empty">加载中...</div>
                    </div>
                </div>
            </div>

            <!-- NOTAM 列表 -->
            <div class="sidebar-section" id="section-notams" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:150px;">
                <div class="section-title" onclick="toggleSection('section-notams')">
                    <span>📋</span>
                    <span>NOTAM 列表</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" id="notam-list" style="flex:1;overflow-y:auto;">
                    <div class="notam-empty">加载中...</div>
                </div>
            </div>

            <!-- 付费功能面板 (Pro) -->
            <div class="sidebar-section" id="section-premium">
                <div class="section-title" onclick="toggleSection('section-premium')">
                    <span>💎</span>
                    <span>高级功能</span>
                    <span class="premium-badge premium-badge-trial">PRO</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content">
                    <!-- 试用提示 -->
                    <div class="trial-banner" id="trial-banner">
                        <div class="trial-banner-text">
                            <span class="trial-icon">🎁</span>
                            <span>免费试用中</span>
                            <span id="trial-days-left" style="font-weight:700">14</span>
                            <span>天</span>
                        </div>
                    </div>
                    <!-- 功能入口 -->
                    <div class="premium-features-grid">
                        <button class="premium-feature-btn" onclick="openPremiumFeature('subscription')">
                            <span class="premium-feature-icon">📡</span>
                            <span class="premium-feature-label">NOTAM 订阅</span>
                        </button>
                        <button class="premium-feature-btn" onclick="openPremiumFeature('flight-plan')">
                            <span class="premium-feature-icon">✈️</span>
                            <span class="premium-feature-label">飞行计划分析</span>
                        </button>
                        <button class="premium-feature-btn" onclick="openPremiumFeature('satellite-pass')">
                            <span class="premium-feature-icon">🛰️</span>
                            <span class="premium-feature-label">卫星过境预测</span>
                        </button>
                        <button class="premium-feature-btn" onclick="openPremiumFeature('api-docs')">
                            <span class="premium-feature-icon">🔌</span>
                            <span class="premium-feature-label">API 接口</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 说明 -->
            <div class="sidebar-section" id="section-info">
                <div class="section-title" onclick="toggleSection('section-info')">
                    <span>💡</span>
                    <span>使用说明</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" style="font-size:11px;color:var(--text-muted);line-height:1.6;">
                    <div style="margin-bottom:4px;">
                        <strong>提示:</strong> 点击图例可筛选区域类型或发射计划，点击列表项可定位到地图位置。
                    </div>
                    <div>发射数据来自 Launch Library 2，每 30 分钟自动更新。仅供参考。</div>
                </div>
            </div>
        </div>

        <!-- 地图区 -->
        <div class="map-container">
            <div id="map"></div>
            <!-- 折叠时的展开按钮 -->
            <button class="btn-expand" id="btn-expand" onclick="toggleSidebar()" title="展开侧边栏">
                <span>▶</span>
                <span class="btn-expand-text">信息面板</span>
            </button>
            <!-- 付费功能 Toast 通知容器 -->
            <div class="premium-toast-container" id="premium-toast-container"></div>
        </div>
    </div>

    <!-- Leaflet JS (本地) + satellite.js + 自定义 JS -->
    <script src="static/leaflet/leaflet.js?v=16"></script>
    <script src="static/js/lib/satellite.min.js"></script>
    <script src="static/js/satellites.js?v=16"></script>
    <script src="static/js/map.js?v=16"></script>
    <!-- 付费功能 JS -->
    <script src="static/js/premium/subscription.js?v=16"></script>
    <script src="static/js/premium/flight_plan.js?v=16"></script>
    <script src="static/js/premium/satellite_pass.js?v=16"></script>
</body>
</html>
